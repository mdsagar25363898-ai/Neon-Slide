<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Slide</title>

<style>
:root{
  --bg:#05000d;
  --panel:#100020;
  --cyan:#00f0ff;
  --magenta:#ff2bd6;
  --lime:#c6ff00;
  --purple:#9b4dff;
  --text:#eafcff;
  --muted:#8a7fb0;
}

*{box-sizing:border-box;}

html,body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  background:
    radial-gradient(circle at 50% -10%,#3a0870 0%,transparent 35%),
    radial-gradient(circle at 0% 100%,#001f35 0%,transparent 30%),
    linear-gradient(135deg,#05000d,#0a0018 50%,#03000a);
  color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:25px 16px 45px;
  overflow-x:hidden;
}

/* Animated background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,240,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,43,214,.025) 1px,transparent 1px);
  background-size:32px 32px;
  animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
  from{transform:translate(0,0);}
  to{transform:translate(32px,32px);}
}

h1{
  margin:3px 0 3px;
  font-size:2rem;
  letter-spacing:3px;
  color:var(--cyan);
  text-shadow:
    0 0 5px var(--cyan),
    0 0 15px var(--cyan),
    0 0 35px rgba(0,240,255,.65);
  animation:titlePulse 2s infinite alternate;
}

@keyframes titlePulse{
  from{filter:brightness(.9);}
  to{filter:brightness(1.35);}
}

.sub{
  color:#a99bd0;
  font-size:.82rem;
  margin-bottom:18px;
  text-align:center;
}

.ad-slot{
  width:min(92vw,420px);
  min-height:55px;
  border:1px dashed #302050;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#62557e;
  font-size:.68rem;
  margin:12px 0;
  background:rgba(255,255,255,.015);
}

/* TOP BAR */

.topbar{
  display:flex;
  gap:9px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:17px;
}

.score-box{
  min-width:78px;
  padding:7px 13px;
  text-align:center;
  border-radius:11px;
  border:1px solid var(--magenta);
  background:
    linear-gradient(145deg,rgba(255,43,214,.12),rgba(10,0,25,.8));
  box-shadow:
    inset 0 0 15px rgba(255,43,214,.15),
    0 0 10px rgba(255,43,214,.25);
}

.score-box .label{
  color:#87769f;
  font-size:.58rem;
  letter-spacing:1.5px;
}

.score-box .value{
  color:var(--magenta);
  font-size:1.25rem;
  font-weight:800;
  text-shadow:
    0 0 5px var(--magenta),
    0 0 13px var(--magenta);
}

button{
  font-family:inherit;
}

button.new,
.lang-btn{
  background:rgba(0,0,0,.25);
  border-radius:10px;
  padding:9px 15px;
  font-size:.78rem;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

button.new{
  border:1px solid var(--lime);
  color:var(--lime);
  box-shadow:
    inset 0 0 12px rgba(198,255,0,.12),
    0 0 8px rgba(198,255,0,.2);
}

.lang-btn{
  border:1px solid #77698e;
  color:#9b8db4;
}

button.new:hover,
.lang-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.3);
}

button.new:active,
.lang-btn:active{
  transform:scale(.94);
}

/* BOARD */

#board-wrap{
  position:relative;
  width:min(92vw,420px);
  aspect-ratio:1/1;
  padding:10px;
  border-radius:20px;
  background:
    linear-gradient(145deg,#18032e,#07000f);
  border:1px solid rgba(0,240,255,.6);
  box-shadow:
    0 0 12px rgba(0,240,255,.5),
    0 0 40px rgba(0,240,255,.14),
    inset 0 0 30px rgba(0,0,0,.9);
  touch-action:none;
}

#board-wrap::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:21px;
  border:1px solid rgba(255,43,214,.25);
  box-shadow:
    0 0 25px rgba(255,43,214,.2);
  pointer-events:none;
}

#board{
  position:relative;
  width:100%;
  height:100%;
}

/* cells */

.cell-bg{
  position:absolute;
  border-radius:11px;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.055);
  box-shadow:
    inset 0 0 10px rgba(0,0,0,.35);
}

/* tiles */

.tile{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  font-weight:900;
  transition:
    left .12s cubic-bezier(.2,.8,.2,1),
    top .12s cubic-bezier(.2,.8,.2,1),
    transform .12s ease,
    opacity .12s ease;
}

.tile-inner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  position:relative;
  overflow:hidden;
}

.tile-inner::after{
  content:"";
  position:absolute;
  top:-100%;
  left:-60%;
  width:35%;
  height:300%;
  transform:rotate(25deg);
  background:rgba(255,255,255,.12);
  animation:shine 3s linear infinite;
}

@keyframes shine{
  from{left:-70%;}
  to{left:150%;}
}

/* Overlay */

.msg-overlay{
  position:absolute;
  inset:10px;
  border-radius:16px;
  background:
    radial-gradient(circle,rgba(20,0,40,.76),rgba(4,0,10,.95));
  backdrop-filter:blur(5px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s;
  z-index:5;
}

.msg-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.msg-overlay h2{
  margin:0;
  font-size:1.7rem;
  letter-spacing:1px;
}

.msg-overlay.win h2{
  color:var(--lime);
  text-shadow:
    0 0 8px var(--lime),
    0 0 25px var(--lime);
  animation:winPulse .8s infinite alternate;
}

.msg-overlay.lose h2{
  color:var(--magenta);
  text-shadow:
    0 0 8px var(--magenta),
    0 0 25px var(--magenta);
}

@keyframes winPulse{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}

.msg-overlay button{
  background:transparent;
  border:1px solid var(--cyan);
  color:var(--cyan);
  padding:9px 20px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
  box-shadow:
    inset 0 0 10px rgba(0,240,255,.12),
    0 0 12px rgba(0,240,255,.3);
}

/* Hint */

.hint{
  margin-top:15px;
  color:#75698d;
  font-size:.72rem;
  text-align:center;
  max-width:340px;
  line-height:1.5;
}

/* Mobile */

@media(max-width:480px){
  body{
    padding-top:18px;
  }

  h1{
    font-size:1.7rem;
  }

  #board-wrap{
    width:min(94vw,420px);
  }

  .score-box{
    min-width:70px;
  }
}
</style>
</head>

<body>

<h1>NEON SLIDE</h1>

<div class="sub" id="sub-text">
টাইলগুলো একসাথে স্লাইড করে ২০৪৮ বানাও
</div>

<div class="ad-slot" id="ad-top">
AD SPACE — 320×50 BANNER
</div>

<div class="topbar">

  <div class="score-box">
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div class="score-box">
    <div class="label">BEST</div>
    <div class="value" id="best">0</div>
  </div>

  <button class="new" id="newGame">
    নতুন গেম
  </button>

  <button class="lang-btn" id="langBtn">
    EN
  </button>

</div>

<div id="board-wrap">
  <div id="board"></div>

  <div class="msg-overlay" id="overlay">
    <h2 id="overlay-title"></h2>
    <button id="overlay-btn">আবার খেলো</button>
  </div>
</div>

<div class="hint" id="hint-text">
অ্যারো কী বা সোয়াইপ করে টাইল স্লাইড করো। একই নাম্বার মিলে গেলে যোগ হয়ে যাবে।
</div>

<div class="ad-slot" id="ad-bottom">
AD SPACE — 320×100 BANNER
</div>

<script>
(function(){

const SIZE=4;

const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlay-title');
const overlayBtn=document.getElementById('overlay-btn');
const newGameBtn=document.getElementById('newGame');
const langBtn=document.getElementById('langBtn');
const subText=document.getElementById('sub-text');
const hintText=document.getElementById('hint-text');
const adTop=document.getElementById('ad-top');
const adBottom=document.getElementById('ad-bottom');

let grid;
let score;
let best;
let won;
let over;
let tileId;
let lang='bn';

/* =========================
   LANGUAGE
========================= */

const STR={

bn:{
sub:'টাইলগুলো একসাথে স্লাইড করে ২০৪৮ বানাও',
newGame:'নতুন গেম',
again:'আবার খেলো',
hint:'অ্যারো কী বা সোয়াইপ করে টাইল স্লাইড করো। একই নাম্বার মিলে গেলে যোগ হয়ে যাবে।',
win:'🎉 তুমি জিতেছো!',
lose:'😵 গেম ওভার',
adTop:'AD SPACE — 320×50 BANNER',
adBottom:'AD SPACE — 320×100 BANNER',
toggle:'EN'
},

en:{
sub:'Slide the tiles together to build 2048',
newGame:'New Game',
again:'Try Again',
hint:'Use arrow keys or swipe to slide the tiles. Matching numbers merge together.',
win:'🎉 You win!',
lose:'😵 Game over',
adTop:'AD SPACE — 320×50 BANNER',
adBottom:'AD SPACE — 320×100 BANNER',
toggle:'বাং'
}

};

function applyLang(){

const s=STR[lang];

subText.textContent=s.sub;
newGameBtn.textContent=s.newGame;
overlayBtn.textContent=s.again;
hintText.textContent=s.hint;
adTop.textContent=s.adTop;
adBottom.textContent=s.adBottom;
langBtn.textContent=s.toggle;

if(won) overlayTitle.textContent=s.win;
if(over) overlayTitle.textContent=s.lose;

}

langBtn.addEventListener('click',()=>{

soundButton();

lang=lang==='bn'?'en':'bn';

applyLang();

});

/* =========================
   SOUND ENGINE
========================= */

let audioCtx=null;

function initAudio(){

if(!audioCtx){

audioCtx=
new (window.AudioContext||window.webkitAudioContext)();

}

if(audioCtx.state==='suspended'){
audioCtx.resume();
}

}

function tone(freq,duration,type='sine',volume=.045,delay=0){

if(!audioCtx)return;

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.type=type;
osc.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);

gain.gain.setValueAtTime(.0001,audioCtx.currentTime+delay);

gain.gain.exponentialRampToValueAtTime(
volume,
audioCtx.currentTime+delay+.01
);

gain.gain.exponentialRampToValueAtTime(
.0001,
audioCtx.currentTime+delay+duration
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start(audioCtx.currentTime+delay);
osc.stop(audioCtx.currentTime+delay+duration+.02);

}

/* move */

function soundMove(){

initAudio();

tone(180,.07,'square',.025);
tone(260,.05,'sine',.018,.025);

}

/* merge */

function soundMerge(){

initAudio();

tone(360,.08,'sine',.045);
tone(540,.10,'sine',.04,.04);
tone(760,.12,'triangle',.035,.08);

}

/* button */

function soundButton(){

initAudio();

tone(500,.05,'square',.025);
tone(720,.07,'sine',.02,.035);

}

/* win */

function soundWin(){

initAudio();

tone(523,.12,'sine',.06);
tone(659,.12,'sine',.06,.12);
tone(784,.15,'sine',.06,.24);
tone(1046,.25,'triangle',.07,.38);

}

/* game over */

function soundLose(){

initAudio();

tone(300,.15,'sawtooth',.035);
tone(220,.18,'sawtooth',.03,.14);
tone(150,.3,'sawtooth',.025,.30);

}

/* =========================
   COLORS
========================= */

const colors={

2:['#071d29','#00f0ff'],
4:['#071a35','#3fd0ff'],
8:['#21103d','#c86bff'],
16:['#390938','#ff2bd6'],
32:['#3d0a1f','#ff5fa8'],
64:['#3d1a08','#ff8a3d'],
128:['#3b3908','#ffe23d'],
256:['#213b08','#c6ff00'],
512:['#083b1f','#3dffb0'],
1024:['#073b3b','#3dffff'],
2048:['#19083d','#a13dff']

};

/* =========================
   STORAGE
========================= */

function loadBest(){

try{
return parseInt(
localStorage.getItem('neonSlideBest')||'0',
10
);
}catch(e){
return 0;
}

}

function saveBest(v){

try{
localStorage.setItem(
'neonSlideBest',
String(v)
);
}catch(e){}

}

/* =========================
   GAME
========================= */

function emptyGrid(){

return Array.from(
{length:SIZE},
()=>Array(SIZE).fill(null)
);

}

function newGame(){

initAudio();
soundButton();

grid=emptyGrid();
score=0;
won=false;
over=false;
tileId=1;

overlay.classList.remove(
'show','win','lose'
);

addRandomTile();
addRandomTile();

render();
updateScore();

}

function addRandomTile(){

const empties=[];

for(let r=0;r<SIZE;r++)
for(let c=0;c<SIZE;c++)
if(!grid[r][c])
empties.push([r,c]);

if(!empties.length)return;

const [r,c]=
empties[
Math.floor(Math.random()*empties.length)
];

grid[r][c]={
id:tileId++,
value:Math.random()<.9?2:4,
isNew:true
};

}

function cellRect(r,c,size){

const gap=10;

const cell=
(size-gap*(SIZE+1))/SIZE;

return{
x:gap+c*(cell+gap),
y:gap+r*(cell+gap),
size:cell
};

}

/* =========================
   RENDER
========================= */

function render(){

boardEl
.querySelectorAll('.cell-bg')
.forEach(e=>e.remove());

const size=boardEl.clientWidth;

for(let r=0;r<SIZE;r++)
for(let c=0;c<SIZE;c++){

const rect=cellRect(r,c,size);

const bg=document.createElement('div');

bg.className='cell-bg';

bg.style.left=rect.x+'px';
bg.style.top=rect.y+'px';
bg.style.width=rect.size+'px';
bg.style.height=rect.size+'px';

boardEl.appendChild(bg);

}

boardEl
.querySelectorAll('.tile')
.forEach(e=>e.remove());

for(let r=0;r<SIZE;r++)
for(let c=0;c<SIZE;c++){

const t=grid[r][c];

if(t)
drawTile(t,r,c,size);

}

}

function fontSizeFor(cell,value){

const len=String(value).length;

let base=cell*.42;

if(len>=4)base=cell*.30;
else if(len>=3)base=cell*.36;

return base;

}

function drawTile(t,r,c,size){

const rect=cellRect(r,c,size);

const el=document.createElement('div');

el.className='tile';

el.style.left=rect.x+'px';
el.style.top=rect.y+'px';
el.style.width=rect.size+'px';
el.style.height=rect.size+'px';

const pair=
colors[t.value]||
['#18083d','#fff'];

const inner=document.createElement('div');

inner.className='tile-inner';

inner.style.background=pair[0];
inner.style.color=pair[1];

inner.style.textShadow=
'0 0 8px '+pair[1]+
',0 0 18px '+pair[1]+'80';

inner.style.border=
'1px solid '+pair[1]+'66';

inner.style.boxShadow=
'0 0 16px '+pair[1]+'40 inset,'+
'0 0 12px '+pair[1]+'40';

inner.style.fontSize=
fontSizeFor(rect.size,t.value)+'px';

inner.textContent=t.value;

el.appendChild(inner);

if(t.isNew){

el.style.transform='scale(.25)';
el.style.opacity='0';

boardEl.appendChild(el);

requestAnimationFrame(()=>{

el.style.transform='scale(1)';
el.style.opacity='1';

});

t.isNew=false;

}
else if(t.merged){

boardEl.appendChild(el);

el.style.transform='scale(1.22)';

requestAnimationFrame(()=>{
el.style.transform='scale(1)';
});

t.merged=false;

}
else{

boardEl.appendChild(el);

}

}

/* =========================
   SCORE
========================= */

function updateScore(){

scoreEl.textContent=score;

if(score>best){

best=score;
saveBest(best);

}

bestEl.textContent=best;

}

/* =========================
   MOVE
========================= */

function cloneGrid(){

return grid.map(row=>
row.map(t=>t?{...t}:null)
);

}

function gridsEqual(a,b){

for(let r=0;r<SIZE;r++)
for(let c=0;c<SIZE;c++){

const ta=a[r][c];
const tb=b[r][c];

if(!ta&&!tb)continue;

if(!ta||!tb)return false;

if(ta.value!==tb.value)return false;

}

return true;

}

function slideLine(line){

const filtered=line.filter(Boolean);

const result=[];
let gained=0;
let mergedAny=false;

for(let i=0;i<filtered.length;i++){

if(
i<filtered.length-1 &&
filtered[i].value===filtered[i+1].value
){

const merged={
id:tileId++,
value:filtered[i].value*2,
merged:true
};

gained+=merged.value;

result.push(merged);

mergedAny=true;

i++;

}
else{

result.push(filtered[i]);

}

}

while(result.length<SIZE)
result.push(null);

return{
line:result,
gained,
mergedAny
};

}

function move(dir){

if(over)return;

initAudio();

const before=cloneGrid();

let gained=0;
let mergedAny=false;

if(dir==='left'||dir==='right'){

for(let r=0;r<SIZE;r++){

let line=grid[r].slice();

if(dir==='right')
line.reverse();

const res=slideLine(line);

gained+=res.gained;

if(res.mergedAny)
mergedAny=true;

let newLine=res.line;

if(dir==='right')
newLine.reverse();

grid[r]=newLine;

}

}
else{

for(let c=0;c<SIZE;c++){

let line=[];

for(let r=0;r<SIZE;r++)
line.push(grid[r][c]);

if(dir==='down')
line.reverse();

const res=slideLine(line);

gained+=res.gained;

if(res.mergedAny)
mergedAny=true;

let newLine=res.line;

if(dir==='down')
newLine.reverse();

for(let r=0;r<SIZE;r++)
grid[r][c]=newLine[r];

}

}

if(!gridsEqual(before,grid)){

score+=gained;

if(mergedAny)
soundMerge();
else
soundMove();

addRandomTile();

render();
updateScore();

checkWin();
checkOver();

}

}

/* =========================
   WIN / LOSE
========================= */

function checkWin(){

if(won||over)return;

for(let r=0;r<SIZE;r++)
for(let c=0;c<SIZE;c++){

if(
grid[r][c] &&
grid[r][c].value>=2048
){

won=true;

overlayTitle.textContent=
STR[lang].win;

overlay.classList.add(
'show','win'
);

overlay.classList.remove('lose');

soundWin();

return;

}

}

}

function canMove(){

for(let r=0;r<SIZE;r++)
for(let c=0;c<SIZE;c++){

if(!grid[r][c])
return true;

const v=grid[r][c].value;

if(
c<SIZE-1 &&
grid[r][c+1] &&
grid[r][c+1].value===v
)
return true;

if(
r<SIZE-1 &&
grid[r+1][c] &&
grid[r+1][c].value===v
)
return true;

}

return false;

}

function checkOver(){

if(!canMove()){

over=true;

overlayTitle.textContent=
STR[lang].lose;

overlay.classList.add(
'show','lose'
);

overlay.classList.remove('win');

soundLose();

}

}

/* =========================
   KEYBOARD
========================= */

window.addEventListener('keydown',(e)=>{

const map={
ArrowLeft:'left',
ArrowRight:'right',
ArrowUp:'up',
ArrowDown:'down'
};

if(map[e.key]){

e.preventDefault();

move(map[e.key]);

}

});

/* =========================
   TOUCH
========================= */

let touchStartX=0;
let touchStartY=0;

const wrap=
document.getElementById('board-wrap');

wrap.addEventListener(
'touchstart',
e=>{

const t=e.touches[0];

touchStartX=t.clientX;
touchStartY=t.clientY;

},
{passive:true}
);

wrap.addEventListener(
'touchend',
e=>{

const t=e.changedTouches[0];

const dx=
t.clientX-touchStartX;

const dy=
t.clientY-touchStartY;

if(
Math.max(
Math.abs(dx),
Math.abs(dy)
)<24
)return;

if(Math.abs(dx)>Math.abs(dy)){

move(dx>0?'right':'left');

}
else{

move(dy>0?'down':'up');

}

},
{passive:true}
);
